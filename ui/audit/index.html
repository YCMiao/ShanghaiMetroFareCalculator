<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上海地铁 · 站距核对</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f5;color:#112d3a;font:16px/1.5 ui-sans-serif,system-ui,"PingFang SC"}.wrap{max-width:860px;margin:auto;padding:44px 20px}header{border-left:8px solid #e73545;padding-left:18px;margin-bottom:28px}h1{margin:0;font-size:32px;letter-spacing:.04em}p{color:#56717d}.stats{display:flex;gap:10px;margin:20px 0}.pill{background:#fff;padding:8px 12px;border-radius:99px;font-weight:700}.pill b{color:#e73545}.card{background:#fff;border:1px solid #d5e0e4;border-radius:16px;padding:26px;box-shadow:0 12px 35px #1232 0}.route{font-size:25px;font-weight:800}.route span{color:#e73545;padding:0 8px}.candidate{margin:20px 0;background:#fff6d8;border-left:5px solid #e5ae27;padding:14px;font-size:18px}.reason{font-size:13px;color:#71858d}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}button,input{font:inherit;border-radius:9px;padding:11px 14px}button{border:0;background:#123e52;color:white;font-weight:700;cursor:pointer}button.good{background:#087b68}input{border:1px solid #aebfc6;width:160px}.empty{padding:40px;text-align:center;background:white;border-radius:16px}.progress{height:4px;background:#dfe8eb;margin:20px 0}.progress i{display:block;height:100%;background:#e73545;width:0;transition:.3s}@media(max-width:560px){h1{font-size:26px}.route{font-size:20px}}
</style><main class="wrap"><header><h1>站距核对台</h1><p>只需确认候选值，或输入图上正确的米数。</p></header><div class="stats"><div class="pill">待核对 <b id="remaining">—</b></div><div class="pill">本次已处理 <b id="done">0</b></div></div><div class="progress"><i id="bar"></i></div><section id="app"></section></main><script>
let items=[],network,done=0,total=0;const $=s=>document.querySelector(s);function name(id){return network.stations.find(s=>s.id===id)?.name||id}function render(){let e=items[0];$('#remaining').textContent=items.length;$('#done').textContent=done;$('#bar').style.width=`${total?done/total*100:100}%`;if(!e){$('#app').innerHTML='<div class="empty"><h2>全部完成</h2><p>没有待核对的区间。</p></div>';return}let edge=network.edges.find(item=>item.id===e.edge_id);if(!edge){$('#app').innerHTML='<div class="empty"><h2>数据错误</h2><p>待审核区间不在当前线路图中。</p></div>';return}let from=name(edge.from_station_id),to=name(edge.to_station_id),candidate=e.nearest_candidate_m;$('#app').innerHTML=`<article class="card"><div class="route">${from}<span>→</span>${to}</div><div class="candidate">${candidate?`读取到的候选值：<strong>${candidate} m</strong>`:'未读取到可靠候选值，请直接填写。'}<div class="reason">${e.reason}</div></div><div class="actions">${candidate?`<button class="good" onclick="save(${candidate})">候选值正确</button>`:''}<input id="manual" type="number" min="1" placeholder="输入米数"><button onclick="save(+$('#manual').value)">保存手动值</button></div></article>`}async function save(distance){if(!Number.isInteger(distance)||distance<1)return alert('请输入正整数米数');let e=items[0],r=await fetch('/api/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({edge_id:e.edge_id,distance_m:distance})});let d=await r.json();if(!r.ok)return alert(d.error);items.shift();done++;render()}Promise.all([fetch('/api/audit').then(r=>r.json()),fetch('/api/network').then(r=>r.json())]).then(([a,n])=>{items=a.entries;network=n;total=items.length;render()})
</script></html>
